<div class="login-container">
  <p-toast></p-toast>

  <div class="scan-card">

    <!-- ✅ LOGO à la place du titre texte -->
    <img src="assets/images/OptiBoxLogo.jpg" alt="OptiBox" class="scan-logo" />

    <!-- Icône barcode animée -->
    <div class="scan-icon">
      <i class="pi pi-qrcode"></i>
    </div>

    <!-- Message principal -->
    <p class="scan-message">Veuillez scanner votre carte</p>

    <!-- Indicateur polling actif -->
    <div class="scan-status">
      <div class="pulse-dot"></div>
      <span>Scanner actif</span>
    </div>

    <!-- Boutons actions -->
    <div class="mt-6 flex flex-col gap-3 w-full">
      <!-- Connexion via badge (polling actuel) -->
      <button
        type="button"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-md text-sm transition"
        (click)="restartPolling()">
        Connexion via lecteur badge
      </button>

      <!-- Nouveau : Login caméra -->
      <button
        type="button"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-md text-sm transition"
        (click)="openCameraLogin()">
        Connexion via caméra
      </button>
    </div>

  </div>
</div>

<!-- ════════════════════════════════════════════════════
     OVERLAY CAMÉRA LOGIN
     ════════════════════════════════════════════════════ -->
<div *ngIf="cameraLoginVisible" class="fixed inset-0 bg-black/80 z-50 flex flex-col">

  <!-- Header -->
  <div class="p-6 text-gray-100 bg-black/60 flex justify-between items-center">
    <div>
      <p class="font-bold text-lg mb-1">
        Connexion par QR code / Code-barres
      </p>
      <p class="text-sm text-gray-300">
        Pointez la caméra vers le QR code ou le code-barres de votre badge.
      </p>
    </div>
    <button
      type="button"
      class="bg-red-500 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg transition"
      (click)="closeCameraLogin()">
      Fermer
    </button>
  </div>

  <!-- Vidéo -->
  <div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md aspect-[3/4] bg-black rounded-2xl overflow-hidden border-4 border-yellow-400 relative">
      <video
        id="login-video"
        autoplay
        playsinline
        class="w-full h-full object-cover">
      </video>
      <canvas
        id="login-canvas"
        class="hidden">
      </canvas>
    </div>
  </div>

  <!-- Info bas -->
  <div class="p-4 bg-black/60">
    <p class="text-gray-200 text-sm">
      Lorsque le code est reconnu, la connexion est effectuée automatiquement.
    </p>
  </div>
</div>
